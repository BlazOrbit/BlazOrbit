<!DOCTYPE html>
<html lang="en" data-bob-scrollbars>
<head>
    <!-- CHARSET & VIEWPORT  -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
        Per-page SEO (title, description, keywords, robots, canonical, og:title/description/url,
        og:type, twitter:title/description) lives in Shared/DocSeo.razor. Anything per-page
        declared here would be APPENDED — not replaced — by Blazor's <HeadContent>, producing
        duplicate tags in the prerendered HTML. Keep this file restricted to site-wide constants.

        The <title> below is only ever seen during the splash boot (before WASM hydrates); it is
        replaced by <PageTitle> from DocSeo on every navigation.
    -->
    <title>BlazOrbit | Modern Open Source Blazor Components for .NET</title>

    <!-- BASE & PRELOAD -->
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <meta name="author" content="BlazOrbit" />

    <!-- OPEN GRAPH — site-wide constants only. og:title / og:description / og:url / og:type come from DocSeo. -->
    <meta property="og:site_name" content="BlazOrbit" />
    <meta property="og:image" content="https://blazorbit.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BlazOrbit — Modern Blazor Component Library" />
    <meta property="og:locale" content="en_US" />

    <!-- TWITTER / X CARDS — constants only. twitter:title / twitter:description come from DocSeo. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@blazorbit" />
    <meta name="twitter:image" content="https://blazorbit.com/og-image.png" />
    <meta name="twitter:image:alt" content="BlazOrbit — Modern Blazor Component Library" />

    <!-- PWA / BROWSER -->
    <meta name="theme-color" content="#c41236" />
    <meta name="application-name" content="BlazOrbit" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BlazOrbit" />

    <!-- STRUCTURED DATA (JSON-LD) -->
    <script type="application/ld+json">
        [
          {
            "@context": "https://schema.org",
            "@type": "Organization",
            "name": "BlazOrbit",
            "url": "https://blazorbit.com",
            "logo": {
              "@type": "ImageObject",
              "url": "https://blazorbit.com/icon-512.png",
              "width": 512,
              "height": 512
            },
            "sameAs": [
              "https://github.com/blazorbit"
            ]
          },
          {
            "@context": "https://schema.org",
            "@type": "SoftwareApplication",
            "name": "BlazOrbit",
            "url": "https://blazorbit.com",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Web, Windows, macOS, Linux",
            "softwareRequirements": "Blazor, .NET",
            "softwareVersion": "1.0",
            "author": {
              "@type": "Organization",
              "name": "BlazOrbit"
            },
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "description": "Blazor Component Library by BlazOrbit. C# first, high-performance, and accessible UI design. Lightweight, customizable, open source, and 100% free."
          },
          {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "BlazOrbit",
            "url": "https://blazorbit.com",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://blazorbit.com/search?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
    </script>

    <!-- FAVICONS & MANIFEST -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-144.png" type="image/png" sizes="144x144" />
    <link rel="apple-touch-icon" href="icon-144.png" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- STYLESHEETS -->
    <link href="_content/BlazOrbit/css/blazorbit.css" rel="stylesheet" />
    <link href="_content/BlazOrbit.Charts/css/blazorbit-charts.css" rel="stylesheet" />
    <link href="BlazOrbit.Docs.Wasm.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/splash.css" />
    <link rel="stylesheet" href="css/docs.css" />

    <!-- IMPORTMAP FOR _framework/dotnet.js fingerprinted -->
    <script type="importmap"></script>
</head>
<body>
    <div id="app">
        <div class="docs-splash">
            <div class="docs-splash__logo">
                <span class="docs-splash__spark"></span>
            </div>
            <div class="docs-splash__text">
                <strong>BlazOrbit</strong>
                <span>Booting documentation&hellip;</span>
            </div>
        </div>
    </div>

    <script src="js/doc-search.js"></script>
    <script src="js/pwa-install.js" defer></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="js/sw-register.js" defer></script>
</body>
</html>
