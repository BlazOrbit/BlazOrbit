# .github/workflows/release-publish.yml
# Publishes stable releases on tags v*
# Creates GitHub release and publishes to NuGet

name: '[Release] Stable Publish'

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # No workflow_dispatch: stable releases are tag-driven only. Manual version
  # entry was an override surface that bypassed the natural source of truth
  # (the git tag) and risked drift from <VersionPrefix>. To re-run a failed
  # release, use the Actions UI "Re-run workflow" button on the original
  # tag-triggered run; that re-fires with the same `github.ref_name`.

env:
  DOTNET_VERSION: |
    8.0.x
    10.0.x
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  router:
    uses: ./.github/workflows/_runner-router.yml
    secrets: inherit

  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      assembly_version: ${{ steps.resolve.outputs.assembly_version }}
    steps:
      - name: Resolve version from tag
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Tag-driven only. Tag must match the `v[0-9]+.[0-9]+.[0-9]+` filter
          # in `on.push.tags`, so REF_NAME is guaranteed to start with `v`.
          # `local` is only valid inside a function, hence the wrapper — top-level
          # `local parts=...` aborts under `set -e` (default GH Actions bash flags).
          extract_assembly_version() {
            local v="$1"
            v="${v%%-*}"
            local parts=(${v//./ })
            echo "${parts[0]:-0}.${parts[1]:-0}.${parts[2]:-0}.${parts[3]:-0}"
          }

          VERSION="${REF_NAME#v}"
          ASSEMBLY_VERSION=$(extract_assembly_version "$VERSION")

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "assembly_version=$ASSEMBLY_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Resolved version: $VERSION"

  build-and-test:
    name: Build and Test
    needs: [router]
    runs-on: ${{ needs.router.outputs.runner }}
    # Each job runs inside a fresh container
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore BlazOrbit.slnx

      - name: Build BuildTools (Release)
        run: dotnet build src/BlazOrbit.BuildTools/BlazOrbit.BuildTools.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Build (Release)
        run: dotnet build BlazOrbit.slnx -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test
        # Category!=Perf excludes timing-based perf guards (e.g. PERF-05) that flake
        # on shared/self-hosted CI runners due to JIT/GC noise. Maintainers still run
        # the full set locally via tests-release.ps1 / tests-debug.ps1.
        run: dotnet test BlazOrbit.slnx -c Release --no-build --verbosity normal --filter "Category!=Perf"

  pack:
    name: Pack NuGet Packages
    needs: [router, build-and-test, version]
    runs-on: ${{ needs.router.outputs.runner }}
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore BlazOrbit.slnx

      - name: Pack packages
        shell: bash
        run: |
          # Capture pack output to scan for NU5xxx packaging warnings (PKG-07).
          # Baseline today is clean; any new warning blocks the release until
          # justified or NoWarn'd in csproj with a comment.
          set -o pipefail
          dotnet pack BlazOrbit.slnx \
            -c Release \
            --no-restore \
            -p:Version=${{ needs.version.outputs.version }} \
            -p:AssemblyVersion=${{ needs.version.outputs.assembly_version }} \
            -p:FileVersion=${{ needs.version.outputs.assembly_version }} \
            -p:InformationalVersion=${{ needs.version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true \
            -o ./artifacts \
            2>&1 | tee pack.log

      - name: Pack templates
        shell: bash
        run: |
          # Templates live in templates/BlazOrbit.Templates.slnx, separate from
          # the root BlazOrbit.slnx, so the upstream `dotnet restore` does not
          # cover them. Restore + pack here in one go and append to pack.log so
          # the NU5xxx audit covers template packaging warnings as well.
          set -o pipefail
          dotnet restore templates/BlazOrbit.Templates.slnx
          dotnet pack templates/BlazOrbit.Templates.csproj \
            -c Release \
            --no-restore \
            -p:PackageVersion=${{ needs.version.outputs.version }} \
            -o ./artifacts \
            2>&1 | tee -a pack.log

      - name: Audit NU5xxx packaging warnings
        run: |
          # Fail the release if dotnet pack emitted any NU5xxx warning. These
          # diagnose structural issues in the produced .nupkg
          # (NU5104 prerelease deps, NU5128 framework mismatch, NU5100 non-
          # standard assembly placement, NU5110/NU5111 naming). See PKG-07.
          # pack.log includes both the main pack and the templates pack output.
          if grep -E "warning NU5[0-9]+" pack.log; then
            echo "::error::NU5xxx packaging warning detected. Review pack.log."
            exit 1
          fi
          echo "No NU5xxx warnings."

      - name: Validate package structure
        run: |
          # Per-package structural assertions. Catches regressions where a
          # csproj refactor silently drops `lib/`, `build/`, `staticwebassets/`,
          # or the README/icon. Each assertion is a fatal block. See PKG-04.
          set -e

          assert_in_pkg() {
            local pkg="$1"
            shift
            local missing=0
            for path in "$@"; do
              if ! unzip -l "$pkg" | awk '{print $4}' | grep -Fxq "$path"; then
                echo "::error::$pkg is missing $path"
                missing=1
              fi
            done
            return $missing
          }

          VERSION="${{ needs.version.outputs.version }}"

          for tfm in net8.0 net10.0; do
            echo "=== Validating $tfm ==="

            # Main library: lib/, consumer-facing _build/.targets, full CSS bundle.
            PKG=./artifacts/BlazOrbit.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.dll" \
              "lib/$tfm/BlazOrbit.xml" \
              "build/BlazOrbit.targets" \
              "staticwebassets/css/blazorbit.css" \
              "README.md" \
              "icon.png"

            # Charts: separate package, ships its own CSS bundle + pre-built
            # ChartInterop.min.js as static web assets so consumers don't need
            # Node/esbuild. CSS is auto-injected by the JS module on first use,
            # so consumers never have to add a manual <link>.
            PKG=./artifacts/BlazOrbit.Charts.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.Charts.dll" \
              "lib/$tfm/BlazOrbit.Charts.xml" \
              "staticwebassets/css/blazorbit-charts.css" \
              "staticwebassets/js/Types/Chart/ChartInterop.min.js" \
              "README.md" \
              "icon.png"

            PKG=./artifacts/BlazOrbit.Core.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.Core.dll" \
              "lib/$tfm/BlazOrbit.Core.xml" \
              "README.md" \
              "icon.png"

            PKG=./artifacts/BlazOrbit.SyntaxHighlight.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.SyntaxHighlight.dll" \
              "README.md" \
              "icon.png"

            PKG=./artifacts/BlazOrbit.FormsFluentValidation.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.FormsFluentValidation.dll" \
              "README.md" \
              "icon.png"

            PKG=./artifacts/BlazOrbit.Localization.Server.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.Localization.Server.dll" \
              "README.md" \
              "icon.png"

            PKG=./artifacts/BlazOrbit.Localization.Shared.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.Localization.Shared.dll" \
              "README.md" \
              "icon.png"

            PKG=./artifacts/BlazOrbit.Localization.Wasm.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.Localization.Wasm.dll" \
              "README.md" \
              "icon.png"

            # Translations: resource-only assembly + culture satellites under
            # lib/$tfm/<culture>/. We only assert the main DLL; the satellite
            # set is iterated frequently as we add cultures, so locking specific
            # culture filenames here would be churny. The csproj's resx → satellite
            # pipeline is a pack-time invariant; absence would surface elsewhere.
            PKG=./artifacts/BlazOrbit.Translations.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.Translations.dll" \
              "README.md" \
              "icon.png"
          done

          # Cross-cutting check: every produced .nupkg under ./artifacts must
          # match a known PackageId. Catches the inverse failure where a new
          # packable project lands in src/ without an entry in this validation
          # block — the release would otherwise publish it un-checked.
          KNOWN_IDS=(
            BlazOrbit
            BlazOrbit.Charts
            BlazOrbit.Core
            BlazOrbit.SyntaxHighlight
            BlazOrbit.FormsFluentValidation
            BlazOrbit.Localization.Server
            BlazOrbit.Localization.Shared
            BlazOrbit.Localization.Wasm
            BlazOrbit.Translations
            BlazOrbit.Templates
          )
          unknown=0
          for nupkg in ./artifacts/*.nupkg; do
            [ -e "$nupkg" ] || continue
            filename=$(basename "$nupkg" .nupkg)
            package_id=${filename%."$VERSION"}
            found=0
            for known in "${KNOWN_IDS[@]}"; do
              if [ "$package_id" = "$known" ]; then
                found=1
                break
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "::error::Unknown PackageId in artifacts: $package_id ($nupkg). Add it to KNOWN_IDS and to the per-package assertion block above."
              unknown=1
            fi
          done
          [ "$unknown" -eq 0 ] || exit 1

          # Templates package — content-only (no lib/), so we just confirm the
          # package shipped and that both template trees survived packing.
          # Specific filenames are intentionally not asserted because the
          # template content is iterated frequently; tighten only after the
          # template surface stabilises.
          PKG=./artifacts/BlazOrbit.Templates.${VERSION}.nupkg
          if [ ! -f "$PKG" ]; then
            echo "::error::$PKG not produced by the templates pack step"
            exit 1
          fi
          for prefix in "content/blazorbit-server/" "content/blazorbit-wasm/"; do
            if ! unzip -l "$PKG" | awk '{print $4}' | grep -Fq "$prefix"; then
              echo "::error::$PKG is missing entries under $prefix"
              exit 1
            fi
          done

          echo "All packages have the expected structure."

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ needs.version.outputs.version }}
          path: ./artifacts/*.nupkg
          retention-days: 30

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [version, pack]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ needs.version.outputs.version }}
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Refuse to publish if version already on NuGet
        # 1:1 invariant: every published NuGet version maps to exactly one
        # commit and exactly one skill. Re-publishing would either be blocked
        # by NuGet's immutability (`409`) or silently no-op the .nupkg push
        # while overwriting the .skill on the GH release — drift. Probe the
        # flat-container endpoint and bail out before either side mutates.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e
          url="https://api.nuget.org/v3-flatcontainer/blazorbit/${VERSION,,}/blazorbit.${VERSION,,}.nupkg"
          status=$(curl -sS -o /dev/null -w "%{http_code}" -I "$url")
          case "$status" in
            200)
              echo "::error::BlazOrbit ${VERSION} already published on NuGet. Bump VersionPrefix in Directory.Build.props and re-tag."
              exit 1
              ;;
            404)
              echo "✅ Version ${VERSION} not on NuGet — safe to publish."
              ;;
            *)
              echo "::warning::Unexpected status $status from NuGet flat-container probe. Proceeding cautiously."
              ;;
          esac

      - name: Push to NuGet
        # `--skip-duplicate` intentionally NOT set: the upstream guard already
        # vetted version uniqueness. If a 409 reaches us anyway (concurrent
        # dispatch, NuGet race), failing loudly is the correct response.
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source ${{ env.NUGET_SOURCE }} \
            --api-key ${{ secrets.NUGET_API_KEY }}

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          # Capture the body of the `## [VERSION]` section: skip the header,
          # stop at the next `## [` heading or the link-reference footer
          # (`---`). Fail loudly if the section is missing so a mistagged
          # release does not ship empty notes.
          sed -n "/^## \[$VERSION\]/,\$p" CHANGELOG.md \
            | sed -n '2,$p' \
            | sed -e '/^## \[/,$d' -e '/^---$/,$d' \
            > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md is missing a [$VERSION] section" >&2
            exit 1
          fi
          # Enumerate the packages we just packed (REL-09: no hardcoded list).
          # The `.nupkg` filenames are `<PackageId>.<Version>.nupkg`; strip the
          # version suffix to recover each id. `.snupkg` files are attached but
          # not listed — symbol packages are not user-installable.
          {
            echo ''
            echo '### Packages'
            for nupkg in ./artifacts/*.nupkg; do
              [ -e "$nupkg" ] || continue
              filename=$(basename "$nupkg" .nupkg)
              package_id=${filename%."$VERSION"}
              echo "- $package_id"
            done
            echo ''
            echo '### Installation'
            echo '```bash'
            echo "dotnet add package BlazOrbit --version $VERSION"
            echo '```'
          } >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ needs.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: ./artifacts/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-skill:
    name: Package BlazOrbit User Skill
    needs: [version, publish]
    # Reusable workflow appends blazorbit-user.skill to the GH release that
    # `publish` just created. 1:1 NuGet:skill mapping; consumers download via
    # https://github.com/<repo>/releases/download/v<version>/blazorbit-user.skill
    uses: ./.github/workflows/package-skill.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tag_name: ${{ github.ref_name }}
      prerelease: false
    secrets: inherit
