# .github/workflows/preview-publish.yml
# Publishes preview NuGet packages + matching .skill from develop on demand.
# Version is read from <VersionPrefix> in Directory.Build.props and suffixed
# with -preview.<run-number>.
#
# Manual trigger only. Pre-merge quality is enforced by preview-gate.yml
# (build + test on every PR to develop). Once merged, develop is considered
# already-validated; this workflow exists to ship a NuGet+skill snapshot
# whenever the maintainer decides — typically batching several merges into
# a single preview to keep the NuGet feed and the GH releases list tidy.

name: '[Release] Preview Publish'

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: |
    8.0.x
    10.0.x
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: preview-publish
  cancel-in-progress: false

jobs:
  router:
    uses: ./.github/workflows/_runner-router.yml
    secrets: inherit

  guard:
    name: Branch Guard
    runs-on: ubuntu-latest
    steps:
      - name: Enforce develop branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/develop" ]; then
            echo "::error::Preview publish can only run on the develop branch. Current: ${{ github.ref }}"
            exit 1
          fi
          echo "✅ Branch guard passed"

  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    needs: guard
    outputs:
      version: ${{ steps.calc.outputs.version }}
      full_version: ${{ steps.calc.outputs.full_version }}
      assembly_version: ${{ steps.calc.outputs.assembly_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Calculate preview version
        id: calc
        run: |
          # Helper: extract assembly-friendly version (strip prerelease suffix, ensure 4 parts)
          extract_assembly_version() {
            local v="$1"
            v="${v%%-*}"
            local parts=(${v//./ })
            echo "${parts[0]:-0}.${parts[1]:-0}.${parts[2]:-0}.${parts[3]:-0}"
          }

          # Version is fully derived from VersionPrefix + run number — no manual
          # override accepted. Each NuGet version is published exactly once,
          # 1:1 with its skill. To re-test something, push a new commit (run
          # number bumps) instead of forcing a duplicate version.

          # Read VersionPrefix from Directory.Build.props
          VERSION_PREFIX=$(grep -oP '<VersionPrefix>\K[^<]+' Directory.Build.props || echo "")
          if [ -z "$VERSION_PREFIX" ]; then
            echo "::error::Could not read <VersionPrefix> from Directory.Build.props"
            exit 1
          fi

          echo "VersionPrefix: $VERSION_PREFIX"

          # Use run number as preview counter (always increasing, no collision risk)
          VERSION="${VERSION_PREFIX}-preview.${GITHUB_RUN_NUMBER}"
          FULL_VERSION="${VERSION_PREFIX}-preview.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:7}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=PREVIEW" >> $GITHUB_OUTPUT
          echo "assembly_version=$(extract_assembly_version "$VERSION_PREFIX")" >> $GITHUB_OUTPUT

          echo "Calculated version: $VERSION"

  build-and-test:
    name: Build and Test
    needs: [router, guard, version]
    runs-on: ${{ needs.router.outputs.runner }}
    # Each job runs inside a fresh container
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore BlazOrbit.slnx

      - name: Build BuildTools (Release)
        run: dotnet build src/BlazOrbit.BuildTools/BlazOrbit.BuildTools.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Build (Release)
        run: dotnet build BlazOrbit.slnx -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test
        # Category!=Perf excludes timing-based perf guards (e.g. PERF-05) that flake
        # on shared/self-hosted CI runners due to JIT/GC noise. Maintainers still run
        # the full set locally via tests-release.ps1 / tests-debug.ps1.
        run: dotnet test BlazOrbit.slnx -c Release --no-build --verbosity normal --filter "Category!=Perf"

  pack:
    name: Pack NuGet Packages
    needs: [router, version, build-and-test]
    runs-on: ${{ needs.router.outputs.runner }}
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore BlazOrbit.slnx

      - name: Pack packages
        run: |
          dotnet pack BlazOrbit.slnx \
            -c Release \
            --no-restore \
            -p:Version=${{ needs.version.outputs.version }} \
            -p:AssemblyVersion=${{ needs.version.outputs.assembly_version }} \
            -p:FileVersion=${{ needs.version.outputs.assembly_version }} \
            -p:InformationalVersion=${{ needs.version.outputs.full_version }} \
            -p:ContinuousIntegrationBuild=true \
            -o ./artifacts

      - name: Pack templates
        # Mirror the stable release flow so the preview feed exposes the
        # templates package alongside the libraries — consumers can validate
        # `dotnet new install BlazOrbit.Templates --version <preview>` against
        # unreleased library bits. Templates live in their own slnx, separate
        # from BlazOrbit.slnx, so we restore explicitly.
        run: |
          dotnet restore templates/BlazOrbit.Templates.slnx
          dotnet pack templates/BlazOrbit.Templates.csproj \
            -c Release \
            --no-restore \
            -p:PackageVersion=${{ needs.version.outputs.version }} \
            -o ./artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ needs.version.outputs.version }}
          path: ./artifacts/*.nupkg
          retention-days: 30

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [version, pack]
    environment: preview
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ needs.version.outputs.version }}
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Refuse to publish if version already on NuGet
        # 1:1 invariant: every published NuGet version maps to exactly one
        # commit and exactly one skill. Re-publishing would either be blocked
        # by NuGet's immutability (`409`) or silently no-op the .nupkg push
        # while overwriting the .skill on the GH release — drift. Probe the
        # flat-container endpoint and bail out before either side mutates.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e
          url="https://api.nuget.org/v3-flatcontainer/blazorbit/${VERSION,,}/blazorbit.${VERSION,,}.nupkg"
          status=$(curl -sS -o /dev/null -w "%{http_code}" -I "$url")
          case "$status" in
            200)
              echo "::error::BlazOrbit ${VERSION} already published on NuGet. Bump the version (typically by pushing a new commit so GITHUB_RUN_NUMBER advances) and re-dispatch."
              exit 1
              ;;
            404)
              echo "✅ Version ${VERSION} not on NuGet — safe to publish."
              ;;
            *)
              echo "::warning::Unexpected status $status from NuGet flat-container probe. Proceeding cautiously."
              ;;
          esac

      - name: Push to NuGet
        # `--skip-duplicate` intentionally NOT set: the upstream guard already
        # vetted version uniqueness. If a 409 reaches us anyway (concurrent
        # dispatch, NuGet race), failing loudly is the correct response.
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source ${{ env.NUGET_SOURCE }} \
            --api-key ${{ secrets.NUGET_API_KEY }}

  package-skill:
    name: Package BlazOrbit User Skill
    needs: [version, publish]
    # Each preview NuGet that ships gets a matching .skill attached to a
    # prerelease GH release tagged v<version>. The reusable workflow creates
    # the release on first call (preview-publish doesn't otherwise create GH
    # releases).
    uses: ./.github/workflows/package-skill.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tag_name: v${{ needs.version.outputs.version }}
      prerelease: true
    secrets: inherit
