# .github/workflows/preview-publish.yml
# Publishes preview NuGet packages + matching .skill from develop on demand.
# Version is read from <VersionPrefix> in Directory.Build.props and suffixed
# with -preview.<run-number>.
#
# Manual trigger only. Pre-merge quality is enforced by preview-gate.yml
# (build + test on every PR to develop). Once merged, develop is considered
# already-validated; this workflow exists to ship a NuGet+skill snapshot
# whenever the maintainer decides - typically batching several merges into
# a single preview to keep the NuGet feed and the GH releases list tidy.

name: '[Release] Preview Publish'

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: |
    8.0.x
    10.0.x
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: preview-publish
  cancel-in-progress: false

jobs:
  router:
    uses: ./.github/workflows/_runner-router.yml
    secrets: inherit

  guard:
    name: Branch Guard
    runs-on: ubuntu-latest
    steps:
      - name: Enforce develop branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/develop" ]; then
            echo "::error::Preview publish can only run on the develop branch. Current: ${{ github.ref }}"
            exit 1
          fi
          echo "✅ Branch guard passed"

  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    needs: guard
    outputs:
      version: ${{ steps.calc.outputs.version }}
      full_version: ${{ steps.calc.outputs.full_version }}
      assembly_version: ${{ steps.calc.outputs.assembly_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Calculate preview version
        id: calc
        run: |
          # Helper: extract assembly-friendly version (strip prerelease suffix, ensure 4 parts)
          extract_assembly_version() {
            local v="$1"
            v="${v%%-*}"
            local parts=(${v//./ })
            echo "${parts[0]:-0}.${parts[1]:-0}.${parts[2]:-0}.${parts[3]:-0}"
          }

          # Version is fully derived from VersionPrefix + run number - no manual
          # override accepted. Each NuGet version is published exactly once,
          # 1:1 with its skill. To re-test something, push a new commit (run
          # number bumps) instead of forcing a duplicate version.

          # Read VersionPrefix from Directory.Build.props
          VERSION_PREFIX=$(grep -oP '<VersionPrefix>\K[^<]+' Directory.Build.props || echo "")
          if [ -z "$VERSION_PREFIX" ]; then
            echo "::error::Could not read <VersionPrefix> from Directory.Build.props"
            exit 1
          fi

          echo "VersionPrefix: $VERSION_PREFIX"

          # Use run number as preview counter (always increasing, no collision risk)
          VERSION="${VERSION_PREFIX}-preview.${GITHUB_RUN_NUMBER}"
          FULL_VERSION="${VERSION_PREFIX}-preview.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:7}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=PREVIEW" >> $GITHUB_OUTPUT
          echo "assembly_version=$(extract_assembly_version "$VERSION_PREFIX")" >> $GITHUB_OUTPUT

          echo "Calculated version: $VERSION"

  build-and-test:
    name: Build and Test
    needs: [ router, guard, version ]
    runs-on: ${{ needs.router.outputs.runner }}
    # Each job runs inside a fresh container
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore BlazOrbit.slnx

      - name: Build (Release)
        run: dotnet build BlazOrbit.slnx -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test
        # Category!=Perf excludes timing-based perf guards that flake
        # on shared/self-hosted CI runners due to JIT/GC noise.
        run: dotnet test BlazOrbit.slnx -c Release --no-build --verbosity normal --filter "Category!=Perf"

  pack:
    name: Pack NuGet Packages
    needs: [ router, version, build-and-test ]
    runs-on: ${{ needs.router.outputs.runner }}
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore BlazOrbit.slnx

      - name: Pack packages
        shell: bash
        run: |
          # Capture pack output to scan for NU5xxx packaging warnings.
          # Mirror the audit policy of release-publish.yml - preview is the
          # canary that surfaces structural regressions before they reach
          # the stable feed.
          set -o pipefail
          dotnet pack BlazOrbit.slnx \
            -c Release \
            --no-restore \
            -p:Version=${{ needs.version.outputs.version }} \
            -p:AssemblyVersion=${{ needs.version.outputs.assembly_version }} \
            -p:FileVersion=${{ needs.version.outputs.assembly_version }} \
            -p:InformationalVersion=${{ needs.version.outputs.full_version }} \
            -p:ContinuousIntegrationBuild=true \
            -o ./artifacts \
            2>&1 | tee pack.log

      - name: Pack templates
        # Mirror the stable release flow so the preview feed exposes the
        # templates package alongside the libraries - consumers can validate
        # `dotnet new install BlazOrbit.Templates --version <preview>` against
        # unreleased library bits. Templates live in their own slnx, separate
        # from BlazOrbit.slnx, so we restore explicitly.
        shell: bash
        run: |
          set -o pipefail
          dotnet restore templates/BlazOrbit.Templates.slnx
          dotnet pack templates/BlazOrbit.Templates.csproj \
            -c Release \
            --no-restore \
            -p:PackageVersion=${{ needs.version.outputs.version }} \
            -o ./artifacts \
            2>&1 | tee -a pack.log

      - name: Audit NU5xxx packaging warnings
        run: |
          # Same audit as release-publish.yml. Preview catches structural
          # regressions (NU5104 prerelease deps, NU5128 framework mismatch,
          # NU5100 non-standard assembly placement, NU5110/NU5111 naming)
          # before they ever reach a stable tag.
          if grep -E "warning NU5[0-9]+" pack.log; then
            echo "::error::NU5xxx packaging warning detected. Review pack.log."
            exit 1
          fi
          echo "No NU5xxx warnings."

      - name: Install unzip
        # `mcr.microsoft.com/dotnet/sdk:10.0` is Debian-based but ships without
        # unzip - the next step's `assert_in_pkg` shells out to `unzip -l` to
        # inspect nupkg contents (a nupkg is a zip). Without this install,
        # every assertion in "Validate package structure" reports "missing"
        # because `unzip` exits with 127 and `grep -Fxq` on empty input fails.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends unzip

      - name: Validate package structure
        # `shell: bash` (rather than the GH Actions default `sh -e {0}` → dash)
        # because the script below uses bash-specific syntax: `KNOWN_IDS=(...)`
        # arrays, `local` in functions, and `[ "$found" -eq 0 ]` with the bash
        # arithmetic context expectations. Dash hits `Syntax error: "("
        # unexpected` on the array declaration.
        shell: bash
        run: |
          # Per-package structural assertions. Mirror of release-publish.yml so
          # any new packable project landing in BlazOrbit.slnx without an entry
          # in KNOWN_IDS fails preview before stable. Keep this block in sync
          # with release-publish.yml's "Validate package structure".
          set -e

          assert_in_pkg() {
            local pkg="$1"
            shift
            local missing=0
            for path in "$@"; do
              if ! unzip -l "$pkg" | awk '{print $4}' | grep -Fxq "$path"; then
                echo "::error::$pkg is missing $path"
                missing=1
              fi
            done
            return $missing
          }

          VERSION="${{ needs.version.outputs.version }}"

          for tfm in net8.0 net10.0; do
            echo "=== Validating $tfm ==="

            PKG=./artifacts/BlazOrbit.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.dll" \
              "lib/$tfm/BlazOrbit.xml" \
              "build/BlazOrbit.targets" \
              "staticwebassets/css/blazorbit.css" \
              "README.md" \
              "icon.png"

            PKG=./artifacts/BlazOrbit.Charts.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.Charts.dll" \
              "lib/$tfm/BlazOrbit.Charts.xml" \
              "staticwebassets/css/blazorbit-charts.css" \
              "staticwebassets/js/Types/Chart/ChartInterop.js" \
              "README.md" \
              "icon.png"

            PKG=./artifacts/BlazOrbit.CodeBlock.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.CodeBlock.dll" \
              "lib/$tfm/BlazOrbit.CodeBlock.xml" \
              "README.md" \
              "icon.png"

            PKG=./artifacts/BlazOrbit.Core.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.Core.dll" \
              "lib/$tfm/BlazOrbit.Core.xml" \
              "README.md" \
              "icon.png"

            PKG=./artifacts/BlazOrbit.SyntaxHighlight.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.SyntaxHighlight.dll" \
              "README.md" \
              "icon.png"

            PKG=./artifacts/BlazOrbit.FormsFluentValidation.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.FormsFluentValidation.dll" \
              "README.md" \
              "icon.png"

            PKG=./artifacts/BlazOrbit.Localization.Server.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.Localization.Server.dll" \
              "README.md" \
              "icon.png"

            PKG=./artifacts/BlazOrbit.Localization.Shared.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.Localization.Shared.dll" \
              "README.md" \
              "icon.png"

            PKG=./artifacts/BlazOrbit.Localization.Wasm.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.Localization.Wasm.dll" \
              "README.md" \
              "icon.png"

            PKG=./artifacts/BlazOrbit.Notifications.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.Notifications.dll" \
              "lib/$tfm/BlazOrbit.Notifications.xml" \
              "README.md" \
              "icon.png"

            PKG=./artifacts/BlazOrbit.Hotkeys.${VERSION}.nupkg
            assert_in_pkg "$PKG" \
              "lib/$tfm/BlazOrbit.Hotkeys.dll" \
              "lib/$tfm/BlazOrbit.Hotkeys.xml" \
              "staticwebassets/js/Hotkey/HotkeyInterop.js" \
              "README.md" \
              "icon.png"
          done

          KNOWN_IDS=(
            BlazOrbit
            BlazOrbit.Charts
            BlazOrbit.CodeBlock
            BlazOrbit.Core
            BlazOrbit.SyntaxHighlight
            BlazOrbit.FormsFluentValidation
            BlazOrbit.Localization.Server
            BlazOrbit.Localization.Shared
            BlazOrbit.Localization.Wasm
            BlazOrbit.Notifications
            BlazOrbit.Hotkeys
            BlazOrbit.Templates
          )
          unknown=0
          for nupkg in ./artifacts/*.nupkg; do
            [ -e "$nupkg" ] || continue
            filename=$(basename "$nupkg" .nupkg)
            package_id=${filename%."$VERSION"}
            found=0
            for known in "${KNOWN_IDS[@]}"; do
              if [ "$package_id" = "$known" ]; then
                found=1
                break
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "::error::Unknown PackageId in artifacts: $package_id ($nupkg). Add it to KNOWN_IDS and to the per-package assertion block above (and mirror in release-publish.yml)."
              unknown=1
            fi
          done
          [ "$unknown" -eq 0 ] || exit 1

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: packages-${{ needs.version.outputs.version }}
          path: ./artifacts/*.nupkg
          retention-days: 30

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [ version, pack ]
    environment: preview
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: packages-${{ needs.version.outputs.version }}
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Refuse to publish if version already on NuGet
        # 1:1 invariant: every published NuGet version maps to exactly one
        # commit and exactly one skill. Re-publishing would either be blocked
        # by NuGet's immutability (`409`) or silently no-op the .nupkg push
        # while overwriting the .skill on the GH release - drift. Probe the
        # flat-container endpoint and bail out before either side mutates.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e
          url="https://api.nuget.org/v3-flatcontainer/blazorbit/${VERSION,,}/blazorbit.${VERSION,,}.nupkg"
          status=$(curl -sS -o /dev/null -w "%{http_code}" -I "$url")
          case "$status" in
            200)
              echo "::error::BlazOrbit ${VERSION} already published on NuGet. Bump the version (typically by pushing a new commit so GITHUB_RUN_NUMBER advances) and re-dispatch."
              exit 1
              ;;
            404)
              echo "✅ Version ${VERSION} not on NuGet - safe to publish."
              ;;
            *)
              echo "::warning::Unexpected status $status from NuGet flat-container probe. Proceeding cautiously."
              ;;
          esac

      - name: Push to NuGet
        # `--skip-duplicate` intentionally NOT set: the upstream guard already
        # vetted version uniqueness. If a 409 reaches us anyway (concurrent
        # dispatch, NuGet race), failing loudly is the correct response.
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source ${{ env.NUGET_SOURCE }} \
            --api-key ${{ secrets.NUGET_API_KEY }}

  package-skill:
    name: Package BlazOrbit User Skill
    needs: [ version, publish ]
    # Each preview NuGet that ships gets a matching .skill attached to a
    # prerelease GH release tagged v<version>. The reusable workflow creates
    # the release on first call (preview-publish doesn't otherwise create GH
    # releases).
    uses: ./.github/workflows/package-skill.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tag_name: v${{ needs.version.outputs.version }}
      prerelease: true
    secrets: inherit
