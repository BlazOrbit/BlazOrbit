# .github/workflows/package-skill.yml
# Regenerates the blazorbit-user skill from source and packages it as a
# downloadable .skill asset on every release. The artifact is also available
# as a workflow artifact for manual inspection.
#
# Usage in docs:
#   [Download blazorbit-user.skill](https://github.com/ORG/REPO/releases/latest/download/blazorbit-user.skill)

name: '[Release] Package BlazOrbit User Skill'

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/BlazOrbit/**'
      - 'src/BlazOrbit.Core/**'
      - '.agents/skills/blazorbit-user/**'
      - 'scripts/skills/blazorbit-user/**'
      - '.github/workflows/package-skill.yml'

env:
  DOTNET_VERSION: |
    8.0.x
    10.0.x
  SKILL_DIR: .agents/skills/blazorbit-user
  SKILL_SCRIPTS_DIR: scripts/skills/blazorbit-user
  SKILL_NAME: blazorbit-user

permissions:
  contents: write
  actions: read

concurrency:
  group: package-skill
  cancel-in-progress: false

jobs:
  regenerate-and-pack:
    name: Regenerate and Package Skill
    # Pinned to ubuntu-latest because the packaging step uses POSIX-only
    # tooling (mkdir -p, zip, unzip). The runner-router was removed because
    # this job never benefits from the self-hosted route.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      # pwsh is pre-installed on ubuntu-latest, no setup needed.

      # The regenerator only needs BlazOrbit.dll + BlazOrbit.Core.dll on disk
      # (it loads them via Assembly.LoadFrom and reflects). Building the full
      # solution would also build docs/BlazOrbit.Docs.Wasm, which requires the
      # `wasm-tools` workload — a slow, network-bound install we don't need.
      # Restore + build BlazOrbit.csproj only; MSBuild pulls Core transitively.
      - name: Restore dependencies
        run: dotnet restore src/BlazOrbit/BlazOrbit.csproj

      - name: Build (Debug)
        run: dotnet build src/BlazOrbit/BlazOrbit.csproj -c Debug --no-restore

      - name: Regenerate skill references
        shell: pwsh
        run: |
          $script = Join-Path $env:SKILL_SCRIPTS_DIR "regenerate-skill.ps1"
          Write-Host "Running regenerator: $script"
          & $script -Configuration Debug -SkipBuild

      - name: Fail on drift (PRs only)
        if: github.event_name == 'pull_request'
        # The autogenerated reference files (components.md, variants.md,
        # icons.md) must be in sync with src/. If a PR changes a [Parameter]
        # or adds/removes a component without committing the regenerated
        # reference, this step prints the diff and fails the build. Run the
        # regenerator locally and commit the result to fix.
        run: |
          set -e
          DIFF=$(git diff -- "$SKILL_DIR/references/components.md" "$SKILL_DIR/references/variants.md" "$SKILL_DIR/references/icons.md" || true)
          if [ -n "$DIFF" ]; then
            echo "::error::Skill references are out of date. Re-run regenerate-skill.ps1 and commit the result."
            echo "$DIFF"
            exit 1
          fi

      - name: Package skill
        if: github.event_name != 'pull_request'
        # Tooling lives under scripts/skills/<skill-name>/ so the skill payload
        # under .agents/skills/<skill-name>/ is naturally clean — no excludes
        # needed in the zip.
        run: |
          mkdir -p ./artifacts
          cd "$SKILL_DIR"
          zip -r "../../artifacts/${SKILL_NAME}.skill" .
          cd -
          echo "=== Packaged contents ==="
          unzip -l "artifacts/${SKILL_NAME}.skill"

      - name: Upload skill artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SKILL_NAME }}-${{ github.sha }}
          path: ./artifacts/${{ env.SKILL_NAME }}.skill
          retention-days: 30

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ./artifacts/${{ env.SKILL_NAME }}.skill
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
