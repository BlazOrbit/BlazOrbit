# .github/workflows/package-skill.yml
# Reusable workflow that regenerates the blazorbit-user skill, packs it as a
# downloadable .skill, and attaches it to an existing/new GitHub release.
#
# Triggered by:
#   - workflow_call from release-publish.yml (stable)  → attach to v<version>
#   - workflow_call from preview-publish.yml (preview) → attach to v<version>
#   - pull_request (paths)                              → drift gate only, no publish
#
# 1:1 mapping: every published NuGet version has a corresponding .skill
# attached to its GitHub release. Consumers download via:
#   https://github.com/<repo>/releases/tag/v<version>
#   https://github.com/<repo>/releases/download/v<version>/blazorbit-user.skill

name: '[Release] Package BlazOrbit User Skill'

on:
  workflow_call:
    inputs:
      version:
        description: 'NuGet/skill version (e.g. 1.0.0 or 1.0.0-preview.42)'
        required: true
        type: string
      tag_name:
        description: 'GitHub release tag to attach to (e.g. v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as prerelease (creates one if absent)'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - 'src/BlazOrbit/**'
      - 'src/BlazOrbit.Core/**'
      - '.agents/skills/blazorbit-user/**'
      - 'scripts/skills/blazorbit-user/**'
      - '.github/workflows/package-skill.yml'

env:
  DOTNET_VERSION: |
    8.0.x
    10.0.x
  SKILL_DIR: .agents/skills/blazorbit-user
  SKILL_SCRIPTS_DIR: scripts/skills/blazorbit-user
  SKILL_NAME: blazorbit-user

permissions:
  contents: write
  actions: read

concurrency:
  # Per-version (or PR) so concurrent NuGet releases serialize their skill
  # attachments and don't race on the same GH release.
  group: package-skill-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-and-pack:
    name: Regenerate and Package Skill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      # The regenerator only needs BlazOrbit.dll + BlazOrbit.Core.dll on disk
      # (it loads them via Assembly.LoadFrom and reflects). Building the full
      # solution would also build docs/BlazOrbit.Docs.Wasm which requires the
      # `wasm-tools` workload — a slow, network-bound install we don't need.
      #
      # `dotnet restore src/BlazOrbit/BlazOrbit.csproj` walks ProjectReferences
      # (Core, CodeGeneration analyzers, SyntaxHighlight) but BuildTools is
      # invoked at build time via MSBuild import in `_build/BlazOrbit.Dev.targets`,
      # not via ProjectReference, so it has to be restored separately.
      - name: Restore dependencies
        run: |
          dotnet restore src/BlazOrbit.BuildTools/BlazOrbit.BuildTools.csproj
          dotnet restore src/BlazOrbit/BlazOrbit.csproj

      - name: Build (Debug)
        run: dotnet build src/BlazOrbit/BlazOrbit.csproj -c Debug --no-restore

      - name: Regenerate skill references
        shell: pwsh
        run: |
          $script = Join-Path $env:SKILL_SCRIPTS_DIR "regenerate-skill.ps1"
          Write-Host "Running regenerator: $script"
          & $script -Configuration Debug -SkipBuild

      # ── PR drift gate ────────────────────────────────────────────────
      - name: Fail on drift (PRs only)
        if: github.event_name == 'pull_request'
        # The autogenerated reference files (components.md, variants.md,
        # icons.md) must be in sync with src/. If a PR changes a [Parameter]
        # or adds/removes a component without committing the regenerated
        # reference, this step prints the diff and fails the build. Run the
        # regenerator locally and commit the result to fix.
        run: |
          set -e
          DIFF=$(git diff -- \
              "$SKILL_DIR/references/components.md" \
              "$SKILL_DIR/references/variants.md" \
              "$SKILL_DIR/references/icons.md" \
              || true)
          if [ -n "$DIFF" ]; then
            echo "::error::Skill references are out of date. Re-run regenerate-skill.ps1 and commit the result."
            echo "$DIFF"
            exit 1
          fi

      # ── workflow_call path: stamp + pack + attach ────────────────────
      - name: Stamp version into SKILL.md
        if: github.event_name == 'workflow_call'
        # The committed `version:` in SKILL.md is a placeholder; the canonical
        # version comes from the NuGet pipeline (Directory.Build.props +
        # preview run number / release tag), passed in by the caller.
        run: |
          set -e
          echo "Stamping version: ${{ inputs.version }}"
          sed -i "s/^version:.*/version: ${{ inputs.version }}/" "$SKILL_DIR/SKILL.md"
          grep '^version:' "$SKILL_DIR/SKILL.md"

      - name: Package skill
        if: github.event_name == 'workflow_call'
        # Tooling lives under scripts/skills/<skill-name>/ so the skill payload
        # under .agents/skills/<skill-name>/ is naturally clean — no excludes
        # needed in the zip.
        run: |
          mkdir -p ./artifacts
          cd "$SKILL_DIR"
          zip -r "../../artifacts/${SKILL_NAME}.skill" .
          cd -
          echo "=== Packaged contents ==="
          unzip -l "artifacts/${SKILL_NAME}.skill"

      - name: Attach to GitHub release
        if: github.event_name == 'workflow_call'
        uses: softprops/action-gh-release@v3
        # If the release already exists (release-publish creates it before
        # calling this workflow) the action APPENDS the .skill file. If it
        # doesn't (preview-publish doesn't create one today) the action
        # creates a new release at the given tag with the .skill attached.
        # We don't pass `name` or `body` so the action falls back to its
        # defaults (preserving any existing release metadata).
        with:
          tag_name: ${{ inputs.tag_name }}
          prerelease: ${{ inputs.prerelease }}
          files: ./artifacts/${{ env.SKILL_NAME }}.skill
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
