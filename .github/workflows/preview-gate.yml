# .github/workflows/preview-gate.yml
# Quality gates for previews - runs on PRs to develop
# Verifies build, test and public API before merging to develop

name: '[Quality] Preview Gate'

on:
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened ]

  workflow_dispatch:

env:
  DOTNET_VERSION: |
    8.0.x
    10.0.x

permissions:
  contents: read
  pull-requests: write  # Needed to add labels
  actions: read

concurrency:
  group: preview-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  router:
    uses: ./.github/workflows/_runner-router.yml
    secrets: inherit

  encoding-check:
    # Audit gate that fast-fails on file-encoding drift 
    # Specifically catches:
    #   - `.tn` files committed with a UTF-8 BOM (would mis-parse silently
    #     at runtime: U+FEFF survives `TrimStart()` and breaks the culture
    #     header check on the first line).
    #   - `.json` files with BOM (some Node tools read JSON as raw bytes).
    #   - Any text file with byte sequences that aren't valid UTF-8
    #     (Latin-1 / CP1252 saved by editors with the wrong default,
    #     mojibake from copy-paste through Windows-1252 tools).
    # Runs outside a container - pwsh is preinstalled on ubuntu-latest and
    # the script doesn't need .NET. Fix locally with:
    #   pwsh ./scripts/fix-encoding-bom.ps1
    name: Encoding Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Verify file encoding
        shell: pwsh
        run: ./scripts/fix-encoding-bom.ps1 -Check

  build-linux:
    name: Build Linux
    needs: router
    runs-on: ${{ needs.router.outputs.runner }}
    # Fresh container
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore BlazOrbit.slnx

      - name: Build (Release)
        run: dotnet build BlazOrbit.slnx -c Release --no-restore -p:TreatWarningsAsErrors=true

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore BlazOrbit.slnx

      - name: Build (Release)
        run: dotnet build BlazOrbit.slnx -c Release --no-restore -p:TreatWarningsAsErrors=true

  tests:
    name: Tests
    needs: router
    runs-on: ${{ needs.router.outputs.runner }}
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore BlazOrbit.slnx

      - name: Build (Release)
        run: dotnet build BlazOrbit.slnx -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test
        # Category!=Perf excludes timing-based perf guards that flake
        # on shared/self-hosted CI runners due to JIT/GC noise.
        run: dotnet test BlazOrbit.slnx -c Release --no-build --verbosity normal --filter "Category!=Perf"

  public-api-shipped-check:
    name: Check Public API Shipped
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Verify PublicAPI.Shipped.txt was not modified
        run: |
          echo "=== Verifying PublicAPI.Shipped.txt integrity ==="

          # PublicAPI.Shipped.txt should only be modified during release.
          SHIPPED_CHANGES=$(git diff --diff-filter=M --name-only origin/develop...HEAD | grep -i "PublicAPI.Shipped.txt" || true)

          if [ -n "$SHIPPED_CHANGES" ]; then
            echo "❌ ERROR: PublicAPI.Shipped.txt was modified"
            echo "This file must only be updated during the release process."
            echo "Modified files:"
            echo "$SHIPPED_CHANGES"
            exit 1
          else
            echo "✅ No changes to PublicAPI.Shipped.txt"
          fi

  summary:
    name: Preview Gate Summary
    runs-on: ubuntu-latest
    needs: [ build-linux, build-windows, tests, public-api-shipped-check ]
    if: always()

    steps:
      - name: Generate summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const jobs = {
              buildLinux: '${{ needs.build-linux.result }}',
              buildWindows: '${{ needs.build-windows.result }}',
              tests: '${{ needs.tests.result }}',
              publicApiShipped: '${{ needs.public-api-shipped-check.result }}'
            };

            let allPassed = true;
            let report = '## Preview Gate Results\n\n';

            for (const [name, result] of Object.entries(jobs)) {
              const icon = result === 'success' ? '✅' : result === 'skipped' ? '⏭️' : '⚠️';
              report += `- ${icon} **${name}**: ${result}\n`;
              if (result !== 'success' && result !== 'skipped') {
                allPassed = false;
              }
            }

            report += '\n';

            if (allPassed) {
              report += '### ✅ Preview Gate Passed\n\n';
              report += 'Ready to merge into develop.';
            } else {
              report += '### ❌ Preview Gate Failed\n\n';
              report += 'There are issues that need to be resolved.';
            }

            core.summary.addRaw(report).write();

            if (!allPassed) {
              core.setFailed('Preview gate failed');
            }
