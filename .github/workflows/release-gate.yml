# .github/workflows/release-gate.yml
# Quality gates for releases - runs on PRs to master
# Verifies build, test and public API before merging to master

name: '[Quality] Release Gate'

on:
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

  workflow_dispatch:
    inputs:
      check_only:
        description: 'Solo verificar, no bloquear'
        type: boolean
        default: false

permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  router:
    uses: ./.github/workflows/_runner-router.yml
    secrets: inherit

  # ARCH-15: build + test on both Linux and Windows. Publishing still happens
  # only from Linux (release-publish.yml), but the gate verifies both platforms
  # before any tag can advance to publish.
  build-linux:
    name: Build Linux
    needs: router
    runs-on: ${{ needs.router.outputs.runner }}
    # Each job runs inside a fresh container
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore BlazOrbit.slnx

      - name: Build (Release)
        run: dotnet build BlazOrbit.slnx -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Audit vulnerable NuGet packages (SEC-09)
        run: |
          # Block the release if any direct or transitive NuGet package has a
          # high/critical advisory. Output is captured so the failure shows
          # the offending package; `dotnet list` exits 0 even when vulns
          # exist, so we grep the output ourselves.
          set -e
          echo "Auditing direct dependencies..."
          dotnet list BlazOrbit.slnx package --vulnerable 2>&1 | tee vuln-direct.log
          echo "Auditing transitive dependencies..."
          dotnet list BlazOrbit.slnx package --vulnerable --include-transitive 2>&1 | tee vuln-transitive.log

          if grep -E "\b(Critical|High)\b" vuln-direct.log vuln-transitive.log; then
            echo "::error::High/Critical vulnerability detected in NuGet dependencies. See logs above."
            exit 1
          fi
          echo "No High/Critical vulnerabilities."

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore BlazOrbit.slnx

      - name: Build (Release)
        run: dotnet build BlazOrbit.slnx -c Release --no-restore -p:TreatWarningsAsErrors=true

  tests:
    name: Tests
    needs: router
    runs-on: ${{ needs.router.outputs.runner }}
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore BlazOrbit.slnx

      - name: Build (Release)
        run: dotnet build BlazOrbit.slnx -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test
        # Category!=Perf excludes timing-based perf guards that flake
        # on shared/self-hosted CI runners due to JIT/GC noise.
        run: dotnet test BlazOrbit.slnx -c Release --no-build --verbosity normal --filter "Category!=Perf"

  public-api-shipped-check:
    name: Check Public API Shipped
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Verify PublicAPI.Shipped.txt was not modified
        run: |
          echo "=== Verifying PublicAPI.Shipped.txt integrity ==="

          # PublicAPI.Shipped.txt should only be modified during release - a real
          # entry change here means someone shipped API surface outside the release
          # flow. A BOM-only delta is NOT that: it is a one-time encoding-normalization
          # artifact (repo policy is UTF-8 without BOM) and never a surface change, so
          # it must not block the gate. Compare content with the leading BOM stripped
          # and only fail on a genuine difference.
          CANDIDATES=$(git diff --diff-filter=M --name-only origin/master...HEAD | grep -i "PublicAPI.Shipped.txt" || true)

          REAL_CHANGES=""
          for f in $CANDIDATES; do
            base=$(git show "origin/master:$f" | sed '1s/^\xEF\xBB\xBF//')
            head=$(sed '1s/^\xEF\xBB\xBF//' "$f")
            if [ "$base" != "$head" ]; then
              REAL_CHANGES="${REAL_CHANGES}${f}"$'\n'
            fi
          done

          if [ -n "$REAL_CHANGES" ]; then
            echo "❌ ERROR: PublicAPI.Shipped.txt was modified"
            echo "This file must only be updated during the release process."
            echo "Modified files:"
            echo "$REAL_CHANGES"
            exit 1
          else
            echo "✅ No meaningful changes to PublicAPI.Shipped.txt (BOM-only deltas ignored)"
          fi

  summary:
    name: Release Gate Summary
    runs-on: ubuntu-latest
    needs: [ build-linux, build-windows, tests, public-api-shipped-check ]
    if: always()

    steps:
      - name: Generate summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const jobs = {
              buildLinux: '${{ needs.build-linux.result }}',
              buildWindows: '${{ needs.build-windows.result }}',
              tests: '${{ needs.tests.result }}',
              publicApiShipped: '${{ needs.public-api-shipped-check.result }}'
            };

            let allPassed = true;
            let report = '## Release Gate Results\n\n';

            for (const [name, result] of Object.entries(jobs)) {
              const icon = result === 'success' ? '✅' : result === 'skipped' ? '⏭️' : '⚠️';
              report += `- ${icon} **${name}**: ${result}\n`;
              if (result !== 'success' && result !== 'skipped') {
                allPassed = false;
              }
            }

            report += '\n';

            if (allPassed) {
              report += '### ✅ Release Gate Passed\n\n';
              report += 'Code meets all requirements for release.';
            } else {
              report += '### ❌ Release Gate Failed\n\n';
              report += 'There are issues that must be resolved before release.';
            }

            core.summary.addRaw(report).write();

            if (!allPassed) {
              core.setFailed('Release gate failed');
            }
